<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Shooter</title>
    <!-- Fonte clássica de Arcade -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🌌 Menu Inicial -->
    <div id="menu" class="menu-container">
        <h1 class="game-title">RETRO SHOOTER</h1>
        
        <div class="input-group">
            <input type="text" id="playerName" placeholder="DIGITE SEU NOME" maxlength="15">
        </div>

        <div class="button-group">
            <button id="startBtn" class="arcade-btn">START</button>
            <button class="arcade-btn secondary" onclick="alert('Funcionalidade em breve!')">OPÇÕES</button>
            <button class="arcade-btn secondary" onclick="alert('Desenvolvido por RayderLuck')">SOBRE</button>
        </div>

        <div class="volume-box">
            <span>VOLUME:</span>
            <input type="range" id="volumeSlider" min="0" max="100" value="50">
        </div>

        <div id="ranking" class="ranking-box">
            <h3>MELHORES JOGADORES</h3>
            <div id="rankingList">Carregando...</div>
        </div>
    </div>

    <!-- 🎮 Tela do Jogo e Joystick Centralizado Abaixo -->
    <div id="game-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <canvas id="gameCanvas" width="800" height="500" style="display: none;"></canvas>
        
        <!-- Joystick Virtual Centralizado -->
        <div id="virtualJoystick" class="joystick-base" style="display: none;">
            <div id="joystickStick" class="joystick-handle"></div>
        </div>
    </div>

    <!-- 💥 Tela de Game Over -->
    <div id="gameOver" class="menu-container" style="display: none;">
        <h1 class="game-title glitch">FIM DE JOGO</h1>
        <p id="finalScore" class="score-text">Pontos: 0</p>
        <button class="arcade-btn" onclick="location.reload()">JOGAR NOVAMENTE</button>
    </div>

    <!-- 🔊 Elementos de Áudio -->
    <audio id="bgMusic" src="fase1.wav" loop></audio>
    <audio id="laserSound" src="laser1.wav"></audio>

    <!-- 🚀 Script Principal Modularizado -->
    <script type="module" src="main.js"></script>
</body>
</html>
